<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Speech to Text</title>
</head>

<body>

    <main>
        <h1>Speech to Text</h1>

        <p id="status" aria-live="polite">
            Ready to record.
        </p>

        <button id="startButton" type="button">
            Start Recording
        </button>

        <button id="stopButton" type="button" disabled>
            Stop Recording
        </button>

        <section>
            <h2>Transcription</h2>

            <p id="transcription" aria-live="polite">
                Transcription text...
            </p>
        </section>
    </main>

</body>
</html>
