<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- Bootstrap -->
	<link
	    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	    rel="stylesheet">
	<link rel="stylesheet"
		href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

		<style>
		    .page-background {
		        background-color: #eef3f8;
		        min-height: 100vh;
		    }

		    .page-title {
		        color: #173b63;
		    }

		    .recorder-card {
		        border-radius: 18px;
		    }

		    .microphone-circle {
		        width: 76px;
		        height: 76px;
		        background-color: #e4eef9;
		        color: #275d91;
		    }

		    .audio-wave {
		        display: flex;
		        justify-content: center;
		        align-items: center;
		        gap: 5px;
		        height: 28px;
		    }

		    .audio-wave span {
		        width: 5px;
		        height: 8px;
		        background-color: #275d91;
		        border-radius: 5px;
		        opacity: 0.6;
		    }

		    .audio-wave span:nth-child(2),
		    .audio-wave span:nth-child(4) {
		        height: 16px;
		    }

		    .audio-wave span:nth-child(3) {
		        height: 24px;
		    }
			
			.record-button {
			    min-width: 165px;
			}

			.start-button {
			    background-color: #275d91;
			    border-color: #275d91;
			}

			.start-button:hover {
			    background-color: #1e4a74;
			    border-color: #1e4a74;
			}

			.transcription-card {
			    border-radius: 18px;
			}

			.transcription-output {
			    min-height: 110px;
			    background-color: #f7f9fc;
			    border: 1px solid #d8e2ec;
			    color: #52606d;
			}
			
			.microphone-circle {
			    transition: background-color 0.2s, color 0.2s,
			                transform 0.2s;
			}

			.microphone-circle.recording {
			    background-color: #275d91;
			    color: white;
			    transform: scale(1.05);
			}

			.audio-wave.recording span {
			    opacity: 1;
			    animation: sound-wave 0.6s ease-in-out infinite alternate;
			}

			.audio-wave.recording span:nth-child(2),
			.audio-wave.recording span:nth-child(4) {
			    animation-delay: 0.2s;
			}

			.audio-wave.recording span:nth-child(3) {
			    animation-delay: 0.4s;
			}

			@keyframes sound-wave {
			    from {
			        transform: scaleY(0.4);
			    }

			    to {
			        transform: scaleY(1);
			    }
			}

			@media (max-width: 575px) {
			    .record-button {
			        width: 100%;
			    }
			}

			@media (prefers-reduced-motion: reduce) {
			    .audio-wave.recording span {
			        animation: none;
			    }
			}
		</style>
		
		
</head>

<body class="page-background">
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
				
				<header class="text-center mb-4">
				    <h1 class="fw-bold mb-2">
				        Speech to Text
				    </h1>

				    <p class="text-secondary mb-0">
				        Record your voice and turn it into text.
				    </p>
				</header>

				<section class="card border-0 shadow-sm mb-4 recorder-card"
				        aria-label="Audio recorder">

				    <div class="card-body p-4 text-center">
						
						<div id="microphoneIndicator"
						     class="microphone-circle d-inline-flex align-items-center justify-content-center rounded-circle mb-3">

						    <i class="bi bi-mic-fill fs-2" aria-hidden="true"></i>
						</div>

						<div id="audioWave"
						     class="audio-wave mb-3"
						     aria-hidden="true">

						    <span></span>
						    <span></span>
						    <span></span>
						    <span></span>
						    <span></span>
						</div>

						<p id="status"
						   class="fw-semibold mb-1"
						   aria-live="polite">

						    Ready to record.
						</p>

						<p class="text-secondary small mb-0">
						    Press start and speak clearly into your microphone.
						</p>

						<div class="d-flex flex-column flex-sm-row justify-content-center gap-2 mt-4">

						    <button id="startButton"
						            class="btn btn-primary start-button record-button"
						            type="button">

						        <i class="bi bi-record-circle me-2"
						           aria-hidden="true"></i>

						        Start Recording
						    </button>

						    <button id="stopButton"
						            class="btn btn-outline-secondary record-button"
						            type="button"
						            disabled>

						        <i class="bi bi-stop-circle me-2"
						           aria-hidden="true"></i>

						        Stop Recording
						    </button>
						</div>

				    </div>

				</section>

				<section class="card shadow-sm border-0 transcription-card">

				    <div class="card-body p-4">

				        <h2 class="h5 page-title mb-3">
				            Transcription
				        </h2>

				        <p id="transcription"
				           class="transcription-output rounded p-3 mb-0"
				           aria-live="polite">

				            Your transcription will appear here after recording.
				        </p>
				    </div>
				</section>
		
		
		</div>
      </div>
    </main>
	

	<script>
	    // Connect JavaScript to the webpage elements
	    const startButton = document.getElementById("startButton");

	    const stopButton = document.getElementById("stopButton");

	    const statusText = document.getElementById("status");

	    const transcriptionText = document.getElementById("transcription");

		const microphoneIndicator = document.getElementById("microphoneIndicator");

		const audioWave = document.getElementById("audioWave");
	    
		// Store the recording information
	    let mediaRecorder;
	    let mediaStream;
	    let recordedChunks = [];

	    // Run the correct function when a button is clicked
	    startButton.addEventListener("click", startRecording);
	    stopButton.addEventListener("click", stopRecording);

	    async function startRecording() {

	        transcriptionText.textContent = "";

	        try {
	            // Ask the browser for microphone access
	            mediaStream =
	                    await navigator.mediaDevices.getUserMedia({
	                        audio: true
	                    });

						// Use WebM when supported or let the browser choose its normal format
						const recorderOptions = {};

						if (MediaRecorder.isTypeSupported("audio/webm")) {
						    recorderOptions.mimeType = "audio/webm";
						}

						mediaRecorder = new MediaRecorder(mediaStream, recorderOptions);
				

	            recordedChunks = [];

	            // Save each piece of recorded audio
	            mediaRecorder.addEventListener(
	                    "dataavailable",
	                    event => {

	                        if (event.data.size > 0) {
	                            recordedChunks.push(event.data);
	                        }
	                    });
						
				// Prepare the complete audio file after recording stops
				mediaRecorder.addEventListener(
				        "stop",
				        sendRecording);

	            mediaRecorder.start();
				
				// Show that recording is currently active
				microphoneIndicator.classList.add("recording");
				audioWave.classList.add("recording");

	            statusText.textContent = "Recording started";
	            startButton.disabled = true;
	            stopButton.disabled = false;

	        } catch (error) {
	            statusText.textContent =
	                    "Microphone access failed.";

	            transcriptionText.textContent =
	                    "Please allow microphone access and try again.";

	            startButton.disabled = false;
	            stopButton.disabled = true;
	        }
	    }

		function stopRecording() {

		    if (mediaRecorder == null
		            || mediaRecorder.state !== "recording") {

		        return;
		    }

		    statusText.textContent =
		            "Recording stopped. Preparing audio...";

		    stopButton.disabled = true;

		    mediaRecorder.stop();
			// Return the recorder design to its normal state
			microphoneIndicator.classList.remove("recording");
			audioWave.classList.remove("recording");

		    // Turn off the microphone
		    mediaStream.getTracks().forEach(
		            track => track.stop());
		}
		
		async function sendRecording() {

		    const mimeType = mediaRecorder.mimeType || "audio/webm";
			
			const extension = getAudioExtension(mimeType);

		    // Combine the recorded pieces into one audio file
		    const audioBlob =
		            new Blob(recordedChunks, {
		                type: mimeType
		            });

		    const formData = new FormData();

		    formData.append(
		            "audio",
		            audioBlob,
		            "recording." + extension);

		    statusText.textContent =
		            "Recording stopped. Transcribing audio...";

		    try {
		        // Send the audio to the Java endpoint
		        const response = await fetch(
		                "/api/v1/transcriptions",
		                {
		                    method: "POST",
		                    body: formData
		                });

		        const result = await response.json();

		        // Check whether the Java endpoint returned an error
		        if (!response.ok) {
		            throw new Error(
		                    result.message
		                    || "Transcription failed.");
		        }

		        transcriptionText.textContent = result.text;

		        statusText.textContent =
		                "Recording stopped. Transcription complete.";

		    } catch (error) {
		        statusText.textContent =
		                "Recording stopped. Transcription failed.";

		        transcriptionText.textContent =
		                error.message;

		    } finally {
		        // Prepare the buttons for another recording
		        startButton.disabled = false;
		        stopButton.disabled = true;
		    }
		}
		

		// Choose a file extension that matches the browser's audio format.

		function getAudioExtension(mimeType) {

		    if (mimeType.includes("mp4")) {
		        return "m4a";
		    }

		    if (mimeType.includes("ogg")) {
		        return "ogg";
		    }

		    if (mimeType.includes("mpeg")) {
		        return "mp3";
		    }

		    if (mimeType.includes("wav")) {
		        return "wav";
		    }

		    return "webm";
		}
		
	</script>
