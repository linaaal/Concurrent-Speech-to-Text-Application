<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Speech to Text</title>
</head>

<body>

    <main>
        <h1>Speech to Text</h1>

        <p id="status" aria-live="polite">
            Ready to record.
        </p>

        <button id="startButton" type="button">
            Start Recording
        </button>

        <button id="stopButton" type="button" disabled>
            Stop Recording
        </button>

        <section>
            <h2>Transcription</h2>

            <p id="transcription" aria-live="polite">
                Transcription text...
            </p>
        </section>
    </main>
	

	<script>
	    // Connect JavaScript to the webpage elements
	    const startButton = document.getElementById("startButton");

	    const stopButton = document.getElementById("stopButton");

	    const statusText = document.getElementById("status");

	    const transcriptionText = document.getElementById("transcription");

	    // Store the recording information
	    let mediaRecorder;
	    let mediaStream;
	    let recordedChunks = [];
		let recordingFormData;

	    // Run the correct function when a button is clicked
	    startButton.addEventListener("click", startRecording);
	    stopButton.addEventListener("click", stopRecording);

	    async function startRecording() {

	        transcriptionText.textContent = "";

	        try {
	            // Ask the browser for microphone access
	            mediaStream =
	                    await navigator.mediaDevices.getUserMedia({
	                        audio: true
	                    });

	            // Create the browser's audio recorder
	            mediaRecorder = new MediaRecorder(mediaStream);

	            recordedChunks = [];

	            // Save each piece of recorded audio
	            mediaRecorder.addEventListener(
	                    "dataavailable",
	                    event => {

	                        if (event.data.size > 0) {
	                            recordedChunks.push(event.data);
	                        }
	                    });
						
				// Prepare the complete audio file after recording stops
				mediaRecorder.addEventListener(
						"stop",
						prepareRecording);

	            mediaRecorder.start();

	            statusText.textContent = "Recording started";
	            startButton.disabled = true;
	            stopButton.disabled = false;

	        } catch (error) {
	            statusText.textContent =
	                    "Microphone access failed.";

	            transcriptionText.textContent =
	                    "Please allow microphone access and try again.";

	            startButton.disabled = false;
	            stopButton.disabled = true;
	        }
	    }


		    if (mediaRecorder == null
		            || mediaRecorder.state !== "recording") {

		        return;
		    }

		    statusText.textContent =
		            "Recording stopped. Preparing audio...";

		    stopButton.disabled = true;

		    mediaRecorder.stop();

		    // Turn off the microphone
		    mediaStream.getTracks().forEach(
		            track => track.stop());
		}
		
		function prepareRecording() {

		    const mimeType =
		            mediaRecorder.mimeType || "audio/webm";

		    // Combine the recorded pieces into one audio file
		    const audioBlob =
		            new Blob(recordedChunks, {
		                type: mimeType
		            });

		    // Create the multipart form expected by the controller
		    recordingFormData = new FormData();

		    recordingFormData.append(
		            "audio",
		            audioBlob,
		            "recording.webm");

		    statusText.textContent = "Recording ready.";

		    transcriptionText.textContent =
		            "The audio is ready to be sent.";

		    startButton.disabled = false;
		    stopButton.disabled = true;
		}
		
	</script>
