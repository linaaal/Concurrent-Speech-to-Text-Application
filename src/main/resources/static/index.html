<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Speech to Text</title>
</head>

<body>

    <main>
        <h1>Speech to Text</h1>

        <p id="status" aria-live="polite">
            Ready to record.
        </p>

        <button id="startButton" type="button">
            Start Recording
        </button>

        <button id="stopButton" type="button" disabled>
            Stop Recording
        </button>

        <section>
            <h2>Transcription</h2>

            <p id="transcription" aria-live="polite">
                Transcription text...
            </p>
        </section>
    </main>
	

	<script>
	    // Connect JavaScript to the webpage elements
	    const startButton = document.getElementById("startButton");

	    const stopButton = document.getElementById("stopButton)

	    const statusText = document.getElementById("status");

	    const transcriptionText = document.getElementById("transcription");

	    // Store the recording information
	    let mediaRecorder;
	    let mediaStream;
	    let recordedChunks = [];

	    // Ask for microphone access when Start is clicked
	    startButton.addEventListener(
	            "click",
	            requestMicrophoneAccess);

	    async function requestMicrophoneAccess() {

	        transcriptionText.textContent = "";

	        try {
	            mediaStream =
	                    await navigator.mediaDevices.getUserMedia({
	                        audio: true
	                    });

	            statusText.textContent =
	                    "Microphone access granted.";

	            // Turn the microphone off until recording is implemented
	            mediaStream.getTracks().forEach(
	                    track => track.stop());

	        } catch (error) {
	            statusText.textContent =
	                    "Microphone access failed.";

	            transcriptionText.textContent =
	                    "Please allow microphone access and try again.";
	        }
	    }
	</script>
