spring.application.name=Assignment1

# Allows Spring to finish current requests before shutting down
server.shutdown=graceful

# Gives Spring up to four seconds to complete the shutdown
spring.lifecycle.timeout-per-shutdown-phase=4s

# OpenAI speech-to-text configuration
# The actual API key comes from the computer's environment
openai.api-key=${OPENAI_API_KEY:}

# Uses this model unless another model is provided
openai.transcription-model=${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}

# Address used for OpenAI API requests
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}

